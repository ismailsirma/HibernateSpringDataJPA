buildscript {
	repositories { mavenCentral() }
	dependencies {
		// liquibase-gradle 3.1.0 references liquibase.Scope at configuration time, so liquibase-core
		// must be on the plugin (buildscript) classloader, not only in liquibaseRuntime.
		classpath 'org.liquibase.gradle:org.liquibase.gradle.gradle.plugin:3.1.0'
		classpath 'org.liquibase:liquibase-core:5.0.3'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}
apply plugin: 'org.liquibase.gradle'

group = 'sirmam.springdatajpa'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	liquibaseVersion = "5.0.3"
	hibernateVersion = '7.4.5.Final'
	springVersion = '7.0.8'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	liquibaseRuntime sourceSets.main.output
	liquibaseRuntime sourceSets.main.runtimeClasspath
	liquibaseRuntime "org.liquibase:liquibase-core:${liquibaseVersion}"
	liquibaseRuntime "org.liquibase.ext:liquibase-hibernate7:${liquibaseVersion}"
	liquibaseRuntime "org.hibernate.orm:hibernate-core:${hibernateVersion}"
	liquibaseRuntime 'jakarta.persistence:jakarta.persistence-api:3.2.0'
	liquibaseRuntime 'mysql:mysql-connector-java:8.0.33'
	liquibaseRuntime 'info.picocli:picocli:4.7.6'
	// liquibase-hibernate7 uses Spring for entity package scanning (ResourcePatternResolver);
	// Spring 7.0.8 matches the version it is built against (provided scope in its pom.xml).
	liquibaseRuntime "org.springframework:spring-core:${springVersion}"
	liquibaseRuntime "org.springframework:spring-beans:${springVersion}"
	liquibaseRuntime "org.springframework:spring-context:${springVersion}"
	liquibaseRuntime "org.springframework:spring-orm:${springVersion}"
}

liquibase {
	activities {
		main {
			//propertyFile 'liquibase.properties'
			changelogFile 'src/main/resources/db/changelog/changelog-master.yaml'
			url 'jdbc:mysql://localhost:3306/wp?useSSL=false&userUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC'
			username 'wpadmin'
			password 'password'
			driver 'com.mysql.cj.jdbc.Driver'
			// reference = the Hibernate model, scanned from the com.example package (like the
			// hibernate:spring: URL Spring Boot apps use). CamelCase->underscore naming so the
			// entity/table names match the live DB (InheritedEntity -> inherited_entity).
			referenceUrl 'hibernate:spring:com.example?dialect=org.hibernate.dialect.MySQLDialect' +
					'&hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy'
		}
	}
}

tasks.named('diffChangelog') { dependsOn 'classes' }

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
		exclude group: 'ch.qos.logback', module: 'logback-classic'
		exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
